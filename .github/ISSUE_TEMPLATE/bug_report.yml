name: Bug report
description: Something does not work as the README says
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and the output you got. Remove any API key first.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `ormedia --version` and `claude --version`, and your operating system.
    validations:
      required: true
